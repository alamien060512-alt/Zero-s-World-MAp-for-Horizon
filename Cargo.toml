[package]
name = "horizon-worldmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "World Map: a fullscreen explored-world map and waypoints, a native Horizon mod"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/worldmap/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
